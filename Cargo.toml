[package]
name = "vps-cron"
version = "0.2.0"
edition = "2021"
description = "A small cron manager for a VPS: schedules shell commands and built-in Rust jobs."

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4.45", features = ["serde"] }
cron = "0.15.0"
dotenv = "0.15.0"
humantime = "2"
humantime-serde = "1.1"
lastfm-client = { version = "4.0.2", features = ["sqlite"] }
reqwest = { version = "0.12.28", features = ["json", "rustls-tls"] }
rusqlite = "0.31"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52.3", features = ["full"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
